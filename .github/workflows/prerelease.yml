name: Prerelease

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (leave empty for branch-only prerelease)"
        required: false
      comment_id:
        description: "Comment ID for reply (set by slash-command dispatcher)"
        required: false

# Least privilege: jobs that run code from the ref under test get read-only
# access, so a malicious branch or PR cannot merge itself or push over main
# before the signing jobs check it out.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      release_tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      signing_ref: ${{ steps.resolve.outputs.signing_ref }}

    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ inputs.pr_number }}"

          if [ -n "$PR_NUMBER" ]; then
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName)
            HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
            CHECKOUT_REF="refs/pull/$PR_NUMBER/head"
          else
            HEAD_SHA="$GITHUB_SHA"
            HEAD_REF="$GITHUB_REF_NAME"
            CHECKOUT_REF="$GITHUB_SHA"
          fi

          LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          BASE="${LATEST_TAG:-v0.0}"
          BASE="${BASE#v}"
          SHORT_SHA="${HEAD_SHA:0:7}"

          if [ -n "$PR_NUMBER" ]; then
            TAG="v${BASE}-pr${PR_NUMBER}.${SHORT_SHA}"
          else
            SAFE_REF="${HEAD_REF//[^a-zA-Z0-9._-]/-}"
            TAG="v${BASE}-${SAFE_REF}.${SHORT_SHA}"
          fi

          # Pin the commit the signing jobs will use, before any code from the
          # ref under test runs. Checking out the branch by name later would let
          # that code move the branch first.
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          SIGNING_REF=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/heads/${DEFAULT_BRANCH}" | cut -f1)
          if [ -z "$SIGNING_REF" ]; then
            echo "could not resolve ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$HEAD_REF"
            echo "checkout_ref=$CHECKOUT_REF"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "signing_ref=$SIGNING_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Release: $TAG ($HEAD_REF @ $SHORT_SHA)"

  create-tag:
    name: Create release tag
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.resolve.outputs.release_tag }}" -m "Prerelease ${{ needs.resolve.outputs.release_tag }}"
          git push origin "${{ needs.resolve.outputs.release_tag }}"

  signing-key:
    name: Derive signing key
    needs: [resolve, create-tag]
    runs-on: ubuntu-latest

    steps:
      # The prerelease builds code from the PR/branch under test, so the key is
      # only ever handled by scripts checked out from a commit of the default
      # branch recorded before that code ran.
      - name: Checkout signing scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.signing_ref }}
          persist-credentials: false

      # Prerelease images are signed with the same key as stable releases, so a
      # tester can install them from the web UI. They are never installed
      # automatically.
      - name: Derive firmware signing public key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          ROTATION_KEY: ${{ vars.OTA_ROTATION_PUBLIC_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "OTA_SIGNING_KEY secret is not set (see docs/firmware-signing.md)" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/ota-signing-key.pem"
          header=firmware/src/ota_public_keys.h
          printf '%s' "$OTA_SIGNING_KEY" > "$key"
          if [ -n "$ROTATION_KEY" ]; then
            python3 scripts/ota_keygen.py --key "$key" --release --extra-key "$ROTATION_KEY" --out-header "$header"
          else
            python3 scripts/ota_keygen.py --key "$key" --release --out-header "$header"
          fi
          rm -f "$key"

      - name: Upload firmware signing public key
        uses: actions/upload-artifact@v7
        with:
          name: ota-pubkey
          path: firmware/src/ota_public_keys.h

  resolve-firmware-envs:
    name: Resolve firmware environments
    needs: [resolve, create-tag]
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs-json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - name: List release environments
        id: envs
        uses: ./.github/actions/list-pio-envs
        with:
          mode: release

  frontend-assets:
    name: Build frontend assets
    needs: [resolve, create-tag]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (lint + typecheck + vite + embed)
        run: npm run build
        working-directory: frontend

      - name: Upload embedded frontend header
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: firmware/src/web_assets.h

  firmware:
    name: Firmware (${{ matrix.env }})
    needs: [resolve, create-tag, resolve-firmware-envs, frontend-assets, signing-key]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.resolve-firmware-envs.outputs.envs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download embedded frontend header
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: firmware/src

      - name: Download firmware signing public key
        uses: actions/download-artifact@v8
        with:
          name: ota-pubkey
          path: firmware/src

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/platformio-requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
            .pio/libdeps
          key: platformio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -r .github/platformio-requirements.txt

      - name: Build firmware
        env:
          FIRMWARE_VERSION: ${{ needs.resolve.outputs.version }}
          PIO_ENV: ${{ matrix.env }}
        run: |
          echo "Building $PIO_ENV..."
          pio run -e "$PIO_ENV"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*-firmware.bin
            .pio/build/${{ matrix.env }}/*-full.tar.gz

  sign-artifacts:
    name: Sign firmware artifacts
    needs: [resolve, firmware]
    runs-on: ubuntu-latest

    steps:
      # Trusted code only, as in the signing-key job.
      - name: Checkout signing scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.signing_ref }}
          persist-credentials: false

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: .pio/build

      - name: Sign firmware images
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "OTA_SIGNING_KEY secret is not set (see docs/firmware-signing.md)" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/ota-signing-key.pem"
          pubkey="$RUNNER_TEMP/ota-signing-key.pub.pem"
          printf '%s' "$OTA_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$pubkey"

          bins=$(find .pio/build -name 'openneato-*-firmware.bin' -type f)
          if [ -z "$bins" ]; then
            echo "no firmware images to sign" >&2
            exit 1
          fi
          for bin in $bins; do
            ./scripts/ota_sign.py sign --key "$key" --version "$VERSION" --bin "$bin"
            ./scripts/ota_sign.py verify --pubkey "$pubkey" --bin "$bin" --token "$bin.token"
          done
          rm -f "$key" "$pubkey"

      - name: Upload signed firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-firmware
          path: .pio/build

  prerelease:
    name: Build and Prerelease
    runs-on: macos-latest
    needs: [resolve, create-tag, sign-artifacts]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download signed firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-firmware
          path: .pio/build

      # GoReleaser hooks are arbitrary shell, and this job holds a write token.
      # Run it with the config from the pinned default-branch commit, copied into
      # the working tree so relative globs resolve as before.
      - name: Checkout trusted release config
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.signing_ref }}
          path: .trusted
          persist-credentials: false

      - name: Use trusted GoReleaser config
        run: |
          cp .trusted/.goreleaser.yml .goreleaser.trusted.yml
          # GoReleaser refuses to run on a dirty tree. Both paths are ours, not
          # the ref under test: .git/info/exclude is outside the checkout.
          exclude="$(git rev-parse --git-dir)/info/exclude"
          mkdir -p "$(dirname "$exclude")"
          printf '.trusted/\n.goreleaser.trusted.yml\n' >> "$exclude"

      # --- Flash tool + GitHub Release ---

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: flash/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .goreleaser.trusted.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark as pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          REF: ${{ needs.resolve.outputs.head_ref }}
          SHA: ${{ needs.resolve.outputs.head_sha }}
          PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          NOTES="Pre-release build from branch \`$REF\` (commit \`$SHA\`)."
          [ -n "$PR" ] && NOTES="Pre-release build from PR #$PR (branch \`$REF\`, commit \`$SHA\`)."

          gh release edit "$TAG" --prerelease --title "Prerelease $TAG" --notes "$NOTES"

      - name: Comment on PR
        if: needs.resolve.outputs.pr_number != '' && inputs.comment_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.release_tag }}"
          gh pr comment "${{ needs.resolve.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Prerelease [\`$TAG\`](https://github.com/${{ github.repository }}/releases/tag/$TAG) is ready."
