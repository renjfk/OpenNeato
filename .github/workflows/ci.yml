name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  firmware-matrix:
    name: Resolve firmware matrix
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs-json }}
    steps:
      - uses: actions/checkout@v7

      - name: List debug environments
        id: envs
        uses: ./.github/actions/list-pio-envs
        with:
          mode: debug

  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: firmware-matrix
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.firmware-matrix.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (generates web_assets.h)
        run: npm ci && npm run build
        working-directory: frontend

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/platformio-requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
            .pio/libdeps
          key: platformio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -r .github/platformio-requirements.txt

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Format check (clang-format)
        run: python scripts/check_format.py

      - name: Static analysis (clang-tidy)
        run: pio check -e ${{ matrix.env }} --fail-on-defect=low

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint and format check
        run: npm run check
        working-directory: frontend

      - name: Build (lint + typecheck + vite + embed)
        run: npm run build
        working-directory: frontend

  flash-tool:
    name: Flash Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: flash/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...
          working-directory: flash

      - name: Build
        run: go build -o openneato-flash .
        working-directory: flash

  update-worker:
    name: Update Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No dependencies to install: the tests run the Worker handler directly.
      - name: Test update host
        run: node --test test/
        working-directory: workers/update

  signing-scripts:
    name: Signing Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Round-trip a throwaway key so the signer and verifier cannot drift apart.
      - name: Sign and verify a sample image
        run: |
          key="$RUNNER_TEMP/test-key.pem"
          pub="$RUNNER_TEMP/test-key.pub.pem"
          work="$RUNNER_TEMP/firmware"
          mkdir -p "$work"
          head -c 4096 /dev/urandom > "$work/openneato-esp32-c3-firmware.bin"

          ./scripts/ota_keygen.py --out-key "$key" --out-header "$RUNNER_TEMP/ota_public_keys.h"
          openssl pkey -in "$key" -pubout -out "$pub"
          ./scripts/ota_sign.py sign --key "$key" --version 9.9 --bin "$work/openneato-esp32-c3-firmware.bin"
          ./scripts/ota_sign.py verify --pubkey "$pub" \
            --bin "$work/openneato-esp32-c3-firmware.bin" \
            --token "$work/openneato-esp32-c3-firmware.bin.token"

          # Tampering has to be detected.
          printf 'x' >> "$work/openneato-esp32-c3-firmware.bin"
          if ./scripts/ota_sign.py verify --pubkey "$pub" \
            --bin "$work/openneato-esp32-c3-firmware.bin" \
            --token "$work/openneato-esp32-c3-firmware.bin.token"; then
            echo "verification accepted a tampered image" >&2
            exit 1
          fi
