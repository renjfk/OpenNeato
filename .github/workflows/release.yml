name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to ship (e.g., v1.0); release-notes/<tag>.md must be committed'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The notes are the repository's, not an input: the tag must carry them, so
      # what the release page shows is what the tagged commit reviewed.
      - name: The release notes are committed for this tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          notes="release-notes/${RELEASE_TAG}.md"
          # an existing tag is what the release job reads, so gate on the tag itself
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            where="tag ${RELEASE_TAG}"
            if ! body=$(git show "${RELEASE_TAG}:${notes}" 2>/dev/null); then
              echo "$notes is missing at ${where}: commit the curated notes and move the tag (RELEASE_PROCESS.md)" >&2
              exit 1
            fi
          else
            where="this commit"
            if [ ! -f "$notes" ]; then
              echo "$notes is missing: commit the curated notes before releasing (RELEASE_PROCESS.md)" >&2
              exit 1
            fi
            body=$(cat "$notes")
          fi
          if ! printf '%s' "$body" | grep -q '[^[:space:]]'; then
            echo "$notes has no content at ${where}: write the curated notes before releasing" >&2
            exit 1
          fi
          echo "notes: $notes at ${where}"

      - name: Create and push release tag
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating new tag: $RELEASE_TAG"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          else
            echo "Tag $RELEASE_TAG already exists"
          fi

      - name: Extract version from tag
        id: version
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          VERSION=${RELEASE_TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Setting version to: $VERSION"

  resolve-firmware-envs:
    name: Resolve firmware environments
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs-json }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: List release environments
        id: envs
        uses: ./.github/actions/list-pio-envs
        with:
          mode: release

  frontend-assets:
    name: Build frontend assets
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (lint + codegen + path-sync + typecheck + vite + embed)
        run: npm run build
        working-directory: frontend

      - name: Upload embedded frontend header
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: firmware/src/web_assets.h

  firmware:
    name: Firmware (${{ matrix.env }})
    needs: [prepare, resolve-firmware-envs, frontend-assets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.resolve-firmware-envs.outputs.envs) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      - name: Download embedded frontend header
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: firmware/src

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/platformio-requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
            .pio/libdeps
          key: platformio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -r .github/platformio-requirements.txt

      - name: Build firmware and package release artifacts
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Building ${{ matrix.env }}..."
          pio run -e "${{ matrix.env }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*-firmware.bin
            .pio/build/${{ matrix.env }}/*-full.tar.gz

  release:
    name: Build and Release
    runs-on: macos-latest
    needs: [prepare, firmware]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: .pio/build

      # --- Flash tool + GitHub Release ---

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: flash/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            release --clean
            --release-notes=release-notes/${{ inputs.release_tag }}.md
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark as pre-release
        if: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.event.inputs.release_tag }}" --prerelease
